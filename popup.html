<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnthonyOS Website Viewer</title><style>
body{margin:0;width:320px;background:#10131c;color:#f3f5ff;font:13px system-ui,sans-serif}
main{padding:16px}h1{font-size:16px;margin:0 0 8px}p{font-size:12px;color:#9ca8c6;line-height:1.5}.summary{background:#1b2232;border:1px solid #3b4660;border-radius:12px;padding:11px;margin:12px 0}.title{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row{display:flex;align-items:center;justify-content:space-between;gap:7px}button{color:#fff;background:#333c54;border:1px solid #586480;border-radius:8px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.45}.primary{background:#6054de}.tags{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.tags button{font-size:11px;text-align:left}.wide{width:100%;margin-top:7px}.error{color:#ffb9a3;min-height:16px;font-size:11px;margin-top:8px}small{color:#a6b1d1}</style></head><body><main><h1>AnthonyOS Website Viewer</h1><p>Open your CRM to start reviewing. Keep that tab open for saving reviews.</p><button class="primary wide" id="crm">Open CRM</button><div class="summary"><div class="row"><small id="count">Not running</small><small id="state"></small></div><div class="title" id="title">No website selected</div></div><div class="row"><button id="prev">← Previous</button><button id="next">Next →</button></div><div class="tags" id="tags"></div><button class="wide" id="review">Mark reviewed without tag</button><div class="error" id="error"></div></main><script src="popup.js"></script></body></html>
